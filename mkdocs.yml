site_name: Fluxion
site_description: A CAS for the TI-84 Plus CE - design notes
site_author: Cloveian
site_url: https://cloveian.github.io/fluxion/docs/

repo_name: Cloveian/fluxion
repo_url: https://github.com/Cloveian/fluxion/

theme:
  name: material
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - footnotes
  # same heading links as obsidian
  - toc:
      permalink: true
      toc_depth: 4
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  # $math$
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search

exclude_docs: |
  *.edtz
  *.canvas

# in the order i made the decisions
nav:
  - Home:
      - index.md
      - Goals & constraints: goals.md
      - Overview: overview.md
  - Design choices:
      - design-choices/index.md
      - Platform: design-choices/platform.md
      - Rendering: design-choices/rendering.md
      - Input: design-choices/input.md
      - Screens & operations: design-choices/ui.md
      - Simplify cases: simplify-cases.md
  - Code:
      - code/index.md
      - Structure: code/structure.md
      - Log: code/log.md
  - Feature roadmap: roadmap.md
  - Shipping checklist: shipping-checklist.md
