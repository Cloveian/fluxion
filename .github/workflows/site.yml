# builds the site and puts it on GitHub Pages: the showcase page (web/, with fluxion compiled
# to wasm) at the root and the mkdocs design notes under docs/
# (Settings -> Pages -> Source has to be "GitHub Actions")
name: Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "web/**"
      - "src/**"
      - "pc.makefile"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # fails on broken links
      - run: mkdocs build --strict --site-dir site/docs

      # same version as it gets built with locally
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12

      - run: make -f pc.makefile web -j4

      # the page and what it loads, not the two test pages
      - run: rsync -a --exclude calc.html --exclude live.html web/ site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
